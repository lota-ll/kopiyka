name: kopiyka

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: kopiyka
    ports:
      - "127.0.0.1:5432:5432"   # тільки localhost, не 0.0.0.0
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kopiyka"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # S3-сумісне сховище для локальної розробки.
    # У production замінюється на R2/S3 зміною KOPIYKA_S3_ENDPOINT_URL.
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      KOPIYKA_ENV: local
      KOPIYKA_AUTH_MODE: dev
      KOPIYKA_INVITE_ONLY: "false"
      KOPIYKA_DATABASE_URL: postgresql+asyncpg://kopiyka_app:devpass@db:5432/kopiyka
      KOPIYKA_MIGRATION_DATABASE_URL: postgresql+asyncpg://postgres:devpass@db:5432/kopiyka
      KOPIYKA_S3_ENDPOINT_URL: http://minio:9000
      KOPIYKA_S3_ACCESS_KEY: minioadmin
      KOPIYKA_S3_SECRET_KEY: minioadmin
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        healthcheck: &dep_healthy
          condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
