[project]
name = "kopiyka"
version = "0.1.0"
description = "Multi-tenant expense analytics from bank statements (mono / privat)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "pyjwt[crypto]>=2.9",
    "httpx>=0.27",
    "charset-normalizer>=3.4",
    "pyyaml>=6.0",
    "boto3>=1.35",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML",
]

[project.scripts]
kopiyka-parse = "kopiyka.parsers.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "C4", "SIM", "RUF"]
# RUF001-003 вимикаємо свідомо: коментарі, docstring та повідомлення
# в цьому проєкті українською, і кирилиця для ruff — «неоднозначні» символи.
ignore = [
    "S101",   # assert дозволено (тести)
    "RUF001", # ambiguous unicode в рядках
    "RUF002", # ambiguous unicode в docstring
    "RUF003", # ambiguous unicode в коментарях
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"migrations/*" = ["E501", "N999"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
exclude = ["migrations/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "db: тест потребує PostgreSQL (пропускається без DATABASE_URL)",
]
