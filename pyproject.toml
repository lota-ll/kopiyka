[project]
name = "kopiyka"
version = "0.1.0"
description = "Multi-tenant expense analytics from bank statements (mono / privat)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "pyjwt[crypto]>=2.9",
    "httpx>=0.27",
    "charset-normalizer>=3.4",
    "pyyaml>=6.0",
    "boto3>=1.35",
    "openpyxl>=3.1",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    # Точний пін, не діапазон: ruff (до релізу 1.0) не гарантує стабільний
    # вивід форматера між версіями — той самий рядок може канонізуватись
    # по-різному в 0.8 і в 0.16. Незапінена версія в CI означає, що build
    # може почервоніти без жодної зміни в коді, тільки тому що PyPI видав
    # новий ruff. Оновлення — свідомий крок (`pip install -U ruff`,
    # прогнати `ruff format` локально, переглянути diff, підняти пін).
    "ruff==0.16.1",
    "mypy==2.3.0",
    "types-PyYAML",
    "types-openpyxl",
]

[project.scripts]
kopiyka-parse = "kopiyka.parsers.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "C4", "SIM", "RUF"]
# RUF001-003 вимикаємо свідомо: коментарі, docstring та повідомлення
# в цьому проєкті українською, і кирилиця для ruff — «неоднозначні» символи.
ignore = [
    "S101",   # assert дозволено (тести)
    "RUF001", # ambiguous unicode в рядках
    "RUF002", # ambiguous unicode в docstring
    "RUF003", # ambiguous unicode в коментарях
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"migrations/*" = ["E501", "N999"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
exclude = ["migrations/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# db/session.py навмисно створює engine ОДИН раз при імпорті модуля —
# це правильний production-патерн (один пул з'єднань на процес), і саме
# так буде працювати uvicorn у контейнері. Але пул asyncpg прив'язується
# до event loop, активного в момент першого підключення. pytest-asyncio
# за замовчуванням дає кожному тесту НОВИЙ loop і закриває попередній —
# тоді другий і подальші тести, що торкаються БД, ловлять
# "Event loop is closed", бо пул лишається підвішеним на мертвому loop.
# Session-scope тут узгоджує тестовий event loop з часом життя engine.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "db: тест потребує PostgreSQL (пропускається без DATABASE_URL)",
]
