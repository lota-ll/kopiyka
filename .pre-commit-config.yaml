repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: detect-private-key

  # rev тут МАЄ збігатися з версією ruff, запіненою в pyproject.toml.
  # pre-commit встановлює для кожного hook-репо власне, ІЗОЛЬОВАНЕ
  # середовище — воно не бачить .venv проєкту. Якщо версії розійдуться,
  # `ruff format --check` у .venv і pre-commit-хук матимуть різну думку
  # про канонічний стиль того самого рядка, і жоден коміт не пройде.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
